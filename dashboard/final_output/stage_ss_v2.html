<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snapshots</title>
  <style>
    /* Minimalist & Compact Styling */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 20px;
        color: #333;
        background-color: #fafafa;
    }

    /* Left side: Links menu */
    .sidebar {
        width: 250px;
        padding-right: 20px;
        border-right: 1px solid #ddd;
    }

    .sidebar h3 {
        margin-top: 0;
        color: #333;
    }

    .sidebar ul {
        list-style-type: none;
        padding: 0;
    }

    .sidebar li {
        margin-bottom: 12px;
    }

    .sidebar a {
        text-decoration: none;
        color: #0066cc;
        cursor: pointer;
        font-weight: bold;
    }

    .sidebar a:hover {
        text-decoration: underline;
    }

    /* Right side: Image preview area */
    .viewer {
        flex-grow: 1;
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .viewer img {
        max-width: 100%;
        max-height: 80vh;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        background-color: #fff;
    }

    .placeholder-text {
        color: #777;
        font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Left Sidebar with Links -->
  <div class="sidebar">
    <h3 id="run-tag">Images</h3>
    <ul id="snapshotList">
      <!-- Snapshots links will be populated here -->
    </ul>
  </div>

  <!-- Right Viewer Area -->
  <div class="viewer" id="imageViewerContainer">
    <p class="placeholder-text">Select a link from the top to view the picture.</p>
  </div>

  <script>
    // Function to dynamically swap out the image when a link is clicked
    function showImage(imageSrc, imageTitle) {
      const viewerContainer = document.getElementById('imageViewerContainer');

      // Clear container and insert the image + optional caption
      viewerContainer.innerHTML = `
        <h4 style="margin-bottom: 10px; color: #333;">${imageTitle}</h4>
        <img src="${imageSrc}" alt="${imageTitle}">
      `;
    }

    function captureSS(bodyData, idStage, idTag) {

      const snapshotList = document.getElementById('snapshotList');
      snapshotList.innerHTML = '' ; // Clear existing

      Object.entries(bodyData).forEach(([par,step]) => {
        step.forEach(groupRow => {
          const dataTag = groupRow.run_tag;
          const dataStage = groupRow.step;
          const stepSS = groupRow.snapshots;

          if ( dataStage === idStage && dataTag === idTag) {
            stepSS.forEach(item => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.innerText = item.snapshot_title;

              a.onclick = function() {
                showImage(item.snapshot_path,item.snapshot_title);
              };

              li.appendChild(a);
              snapshotList.appendChild(li);
            });
          } else {
            document.getElementById('snapshotList').innerHTML = '<li>No image found for this run tag.</li>';
          }
        });
      });
    }

    const parRunSS = {
      "par_ddr": [
        { "run_tag": "R080_20260606", "step": "init", "snapshots": [
          { "snapshot_title": "Place Opt Congestion", "snapshot_path": "/proj/sandbox/guangye.leong/DASHBOARD/snapshots/place_opt_congestion.png" },
          { "snapshot_title": "Route Opt Congestion", "snapshot_path": "/proj/sandbox/guangye.leong/DASHBOARD/snapshots/route_opt_congestion.png" }
        ]},
        { "run_tag": "R080_20260606", "step": "floorplan", "snapshots": []
        },
        { "run_tag": "R051_20260303", "step": "init", "snapshots": []
        }],
      "par_usb": [
        { "run_tag": "R080_20260808", "step": "place_opt", "snapshots": [
          { "snapshot_title": "Place Opt Congestion", "snapshot_path": "/proj/sandbox/guangye.leong/DASHBOARD/snapshots/place_opt_congestion.png" },
          { "snapshot_title": "Route Opt Congestion", "snapshot_path": "/proj/sandbox/guangye.leong/DASHBOARD/snapshots/route_opt_congestion.png" }
        ]},
        { "run_tag": "R080_20260808", "step": "floorplan", "snapshots": []
        }]
    }

    const urlParams = new URLSearchParams(window.location.search);
    const stepId = urlParams.get('id');

    if (stepId) {
      const split_title = stepId.split("_");
      displayTitle = split_title.join(" ");
      document.getElementById('run-tag').innerText = displayTitle
      parName = split_title[0];
      runTag = split_title[1];
      stepName = split_title[2];
      if (parRunSS[parName]) {
        currentParRunSS = { [parName]: parRunSS[parName] };
      }

      captureSS(currentParRunSS,stepName,runTag);
    }
  </script>

</body>
</html>
